{{- /*
Reusable daisyUI collapse block.

@context {string} title Collapse title.
@context {string} content Pre-rendered HTML content.
*/ -}}
{{- $title := .title | default "" -}}
<div class="not-prose mt-4 collapse collapse-arrow border border-base-300">
  <input type="checkbox" />
  <div class="collapse-title text-primary">{{- $title -}}</div>
  <div class="collapse-content overflow-x-auto p-0">
    {{- .content -}}
  </div>
</div>
